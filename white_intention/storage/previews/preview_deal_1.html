<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dental Care - Modern Digital Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-2xl font-bold tracking-tight text-blue-600">Apex Dental Care</span>
            <span class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-semibold">Ready for Review</span>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-6 py-20 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
            Welcome to Apex Dental Care
        </h1>
        <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-10">
            Crafted for speed, conversion, and elevated user trust.
        </p>
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-left max-w-xl mx-auto">
            <h3 class="font-bold text-slate-800 mb-2">Delivered Project Scope:</h3>
            <p class="text-slate-600">Modern 4-page responsive website + WhatsApp & consultation booking</p>
        </div>
    </main>
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        Engineered & Deployed by White Intention
    </footer>

</html>
