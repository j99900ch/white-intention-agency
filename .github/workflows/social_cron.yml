name: White Intention 24/7 Social Automation

on:
  schedule:
    # Shifted to odd minutes to bypass GitHub queue delays
    # 04:17 UTC = 09:47 AM IST (Slot 0 - Image Post)
    - cron: "17 4 * * *"
    # 07:17 UTC = 12:47 PM IST (Slot 1 - Video Reel)
    - cron: "17 7 * * *"
    # 10:17 UTC = 03:47 PM IST (Slot 2 - Image Post)
    - cron: "17 10 * * *"
    # 13:17 UTC = 06:47 PM IST (Slot 3 - Video Reel)
    - cron: "17 13 * * *"
    # 16:17 UTC = 09:47 PM IST (Slot 4 - Image Post)
    - cron: "17 16 * * *"
  repository_dispatch:
    types: [auto-social-post]
  workflow_dispatch:

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Time Slot
        id: slot
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" -ge 3 ] && [ "$HOUR" -lt 6 ]; then
            echo "SLOT=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 9 ]; then
            echo "SLOT=1" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 12 ]; then
            echo "SLOT=2" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 15 ]; then
            echo "SLOT=3" >> $GITHUB_OUTPUT
          else
            echo "SLOT=4" >> $GITHUB_OUTPUT
          fi

      - name: Run Dynamic Content Publisher
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python dynamic_social_engine.py ${{ steps.slot.outputs.SLOT }}